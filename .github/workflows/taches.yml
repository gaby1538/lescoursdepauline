# Appelle /api/taches : garde le projet Supabase éveillé, envoie les
# rappels avant les séances, le récapitulatif du lundi et la sauvegarde
# mensuelle.
#
# PLANIFICATION DÉSACTIVÉE, le 14 novembre 2026.
#
# GitHub dépriorise les tâches planifiées des comptes gratuits. Mesuré
# sur ce dépôt : des écarts de quatre à huit heures entre deux
# exécutions, pour un intervalle demandé de dix minutes. Acceptable
# pour un récapitulatif hebdomadaire, rédhibitoire pour un rappel censé
# partir trente minutes avant le cours.
#
# C'est cron-job.org qui appelle désormais l'adresse toutes les cinq
# minutes, et qui prévient par email en cas d'échec.
#
# Ce fichier reste en place comme filet : l'onglet Actions permet de
# lancer la tâche à la main (Run workflow) si cron-job.org tombe. Pour
# la réactiver, rétablir la ligne « schedule » ci-dessous et vérifier
# que le secret CLE_TACHES correspond bien à la variable de Vercel,
# qui a changé depuis.

name: Tâches régulières

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  appeler:
    runs-on: ubuntu-latest
    steps:
      - name: Réveil et rappels
        env:
          URL_SITE: ${{ secrets.URL_SITE }}
          CLE_TACHES: ${{ secrets.CLE_TACHES }}
        run: |
          if [ -z "$URL_SITE" ]; then
            echo "❌ Le secret URL_SITE est vide ou absent du dépôt."
            exit 1
          fi
          if [ -z "$CLE_TACHES" ]; then
            echo "❌ Le secret CLE_TACHES est vide ou absent du dépôt."
            exit 1
          fi

          # Une barre finale dans URL_SITE donnerait //api/taches.
          base="${URL_SITE%/}"
          echo "Appel de $base/api/taches"

          code=$(curl -sS -o reponse.txt -w "%{http_code}" \
            --max-time 60 \
            -H "x-cle-taches: $CLE_TACHES" \
            "$base/api/taches" || echo "000")

          echo "--- réponse du site ---"
          cat reponse.txt || true
          echo
          echo "-----------------------"

          case "$code" in
            200)
              echo "✅ Tâches exécutées."
              ;;
            403)
              echo "❌ 403 — la clé envoyée ne correspond pas à celle du site."
              echo "   Recopiez la même valeur dans les deux, sans espace ni"
              echo "   retour à la ligne, puis redéployez Vercel."
              exit 1
              ;;
            503)
              echo "❌ 503 — la variable CLE_TACHES manque côté Vercel,"
              echo "   ou le site n'a pas été redéployé depuis son ajout."
              exit 1
              ;;
            404)
              echo "❌ 404 — la route est introuvable à cette adresse."
              echo "   Vérifiez URL_SITE, et que le dernier déploiement est passé."
              exit 1
              ;;
            000)
              echo "❌ Aucune réponse. URL_SITE est-elle correcte et joignable ?"
              exit 1
              ;;
            *)
              echo "❌ Réponse inattendue : HTTP $code"
              exit 1
              ;;
          esac
