# Appelle /api/taches toutes les dix minutes : garde le projet Supabase
# éveillé et envoie les rappels avant les séances.
#
# Deux secrets à créer dans le dépôt, Settings → Secrets and variables
# → Actions :
#   URL_SITE   — https://lescoursdepauline.com (sans barre finale)
#   CLE_TACHES — la même valeur que la variable CLE_TACHES de Vercel
#
# GitHub suspend les tâches planifiées d'un dépôt resté soixante jours
# sans activité. Un commit, même minime, les relance.

name: Tâches régulières

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  appeler:
    runs-on: ubuntu-latest
    steps:
      - name: Réveil et rappels
        env:
          URL_SITE: ${{ secrets.URL_SITE }}
          CLE_TACHES: ${{ secrets.CLE_TACHES }}
        run: |
          if [ -z "$URL_SITE" ]; then
            echo "❌ Le secret URL_SITE est vide ou absent du dépôt."
            exit 1
          fi
          if [ -z "$CLE_TACHES" ]; then
            echo "❌ Le secret CLE_TACHES est vide ou absent du dépôt."
            exit 1
          fi

          # Une barre finale dans URL_SITE donnerait //api/taches.
          base="${URL_SITE%/}"
          echo "Appel de $base/api/taches"

          code=$(curl -sS -o reponse.txt -w "%{http_code}" \
            --max-time 60 \
            -H "x-cle-taches: $CLE_TACHES" \
            "$base/api/taches" || echo "000")

          echo "--- réponse du site ---"
          cat reponse.txt || true
          echo
          echo "-----------------------"

          case "$code" in
            200)
              echo "✅ Tâches exécutées."
              ;;
            403)
              echo "❌ 403 — la clé a été refusée. Deux causes possibles :"
              echo "   • la variable CLE_TACHES n'existe pas encore dans Vercel,"
              echo "     ou le site n'a pas été redéployé depuis son ajout ;"
              echo "   • sa valeur diffère de celle du secret GitHub."
              exit 1
              ;;
            404)
              echo "❌ 404 — la route est introuvable à cette adresse."
              echo "   Vérifiez URL_SITE, et que le dernier déploiement est passé."
              exit 1
              ;;
            000)
              echo "❌ Aucune réponse. URL_SITE est-elle correcte et joignable ?"
              exit 1
              ;;
            *)
              echo "❌ Réponse inattendue : HTTP $code"
              exit 1
              ;;
          esac
